name: Update website on Bottlerocket release
on:
  schedule:
    # Check for new releases every Monday at 9:00 AM UTC
    - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Bottlerocket version to update for (e.g. 1.62.0). Leave empty to auto-detect latest release."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine versions to process
        id: versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Determine the target (upper bound) version to update to.
          if [ -n "$INPUT_VERSION" ]; then
            TARGET="$INPUT_VERSION"
          else
            # Get latest release tag from bottlerocket repo (unauthenticated)
            TARGET=$(curl -s https://api.github.com/repos/bottlerocket-os/bottlerocket/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          fi
          echo "Target version: $TARGET"

          # Determine the newest version already present on the website.
          CURRENT=$(ls -d content/en/os/*/version-information/packages/*/ 2>/dev/null \
            | awk -F/ '{print $(NF-1)}' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          echo "Current website version: ${CURRENT:-none}"

          # Fetch all published release tags (not just the latest) so that any
          # intermediate releases between CURRENT and TARGET are picked up.
          ALL=$(curl -s "https://api.github.com/repos/bottlerocket-os/bottlerocket/releases?per_page=100" \
            | jq -r '.[].tag_name' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)

          # Select releases that are newer than CURRENT and no newer than TARGET,
          # in ascending semver order (oldest first). Each run of the update
          # script builds on the previous run's working-tree changes, so ordering
          # from oldest to newest is required for minor bumps that copy content
          # forward from the previous minor version.
          PENDING=""
          for v in $(echo "$ALL" | sort -V); do
            # Skip versions already present on the website.
            MMX="$(echo "$v" | cut -d. -f1).$(echo "$v" | cut -d. -f2).x"
            if [ -d "content/en/os/${MMX}/version-information/packages/${v}" ]; then
              continue
            fi
            # Must be strictly greater than CURRENT (when a current version exists).
            if [ -n "${CURRENT:-}" ]; then
              if [ "$v" = "$CURRENT" ]; then
                continue
              fi
              lowest=$(printf '%s\n%s\n' "$CURRENT" "$v" | sort -V | head -1)
              if [ "$lowest" != "$CURRENT" ]; then
                # v < CURRENT
                continue
              fi
            fi
            # Must be no newer than TARGET.
            highest=$(printf '%s\n%s\n' "$v" "$TARGET" | sort -V | tail -1)
            if [ "$highest" != "$TARGET" ]; then
              # v > TARGET
              continue
            fi
            PENDING="$PENDING $v"
          done
          PENDING=$(echo "$PENDING" | xargs || true)
          echo "Versions to process (oldest to newest): ${PENDING:-none}"

          if [ -z "$PENDING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "versions=$PENDING" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Run website update script
        if: steps.versions.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for v in ${{ steps.versions.outputs.versions }}; do
            echo "::group::Updating website for ${v}"
            scripts/website-boiler-plate-generator/update_website.sh -b "${v}"
            echo "::endgroup::"
          done

      - name: Create Pull Request
        if: steps.versions.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update website for ${{ steps.versions.outputs.target }}"
          branch: update-website-${{ steps.versions.outputs.target }}
          base: main
          title: "chore: update website for v${{ steps.versions.outputs.target }}"
          body: |
            Automated update for Bottlerocket release(s): ${{ steps.versions.outputs.versions }}.

            This PR was generated by detecting new release(s) on
            [bottlerocket-os/bottlerocket](https://github.com/bottlerocket-os/bottlerocket/releases).
            The website update script was run once per release, in ascending order,
            to include every version between the previously published version and
            the latest.

            **Terms of contribution:**

            By submitting this pull request, I confirm that my contribution is made under
            the terms of the licenses outlined in the LICENSE-SUMMARY file.
