name: Update website on Bottlerocket release
on:
  schedule:
    # Check for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Bottlerocket version to update for (e.g. 1.62.0). Leave empty to auto-detect latest release.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Get latest release tag from bottlerocket repo
            LATEST=$(gh api repos/bottlerocket-os/bottlerocket/releases/latest --jq '.tag_name' | sed 's/^v//')
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if already updated
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR_MINOR_X="$(echo "$VERSION" | cut -d. -f1).$(echo "$VERSION" | cut -d. -f2).x"
          if [ -d "content/en/os/${MAJOR_MINOR_X}/version-information/packages/${VERSION}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run website update script
        if: steps.check.outputs.skip == 'false'
        run: |
          scripts/website-boiler-plate-generator/update_website.sh -b "${{ steps.version.outputs.version }}"

      - name: Create Pull Request
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: update website for ${{ steps.version.outputs.version }}'
          branch: update-website-${{ steps.version.outputs.version }}
          base: main
          title: 'chore: update website for v${{ steps.version.outputs.version }}'
          body: |
            Automated update for Bottlerocket v${{ steps.version.outputs.version }}.

            This PR was generated by detecting a new release on
            [bottlerocket-os/bottlerocket](https://github.com/bottlerocket-os/bottlerocket/releases).

            **Terms of contribution:**

            By submitting this pull request, I confirm that my contribution is made under
            the terms of the licenses outlined in the LICENSE-SUMMARY file.
